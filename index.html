<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>无猜扫雷</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-wash" aria-hidden="true"></div>
  <main class="app">
    <header class="hero">
      <p class="brand">无猜扫雷</p>
      <h1 class="tagline">每一步都能靠逻辑推出来</h1>
      <p class="sub">柔和界面 · 三档难度 · 打开即可玩</p>
    </header>

    <section class="panel" aria-label="游戏控制">
      <div class="difficulty" role="group" aria-label="难度">
        <button type="button" class="diff-btn active" data-diff="easy">简单</button>
        <button type="button" class="diff-btn" data-diff="medium">中等</button>
        <button type="button" class="diff-btn" data-diff="hard">困难</button>
      </div>

      <div class="hud">
        <div class="stat">
          <span class="stat-label">剩余</span>
          <span class="stat-value" id="mine-count">10</span>
        </div>
        <button type="button" class="face" id="face-btn" title="新游戏" aria-label="新游戏">◎</button>
        <div class="stat">
          <span class="stat-label">用时</span>
          <span class="stat-value" id="timer">0</span>
        </div>
      </div>

      <p class="hint" id="status-text">左键翻开，右键插旗。开局保证可纯逻辑通关。</p>
    </section>

    <section class="board-wrap">
      <div class="board" id="board" role="grid" aria-label="雷区"></div>
      <div class="overlay hidden" id="overlay">
        <div class="overlay-card">
          <p class="overlay-title" id="overlay-title">胜利</p>
          <p class="overlay-msg" id="overlay-msg">漂亮，整盘都靠推理完成。</p>
          <button type="button" class="primary-btn" id="again-btn">再来一局</button>
        </div>
      </div>
    </section>

    <footer class="foot">
      <span>提示：长按或双指点也可插旗（触屏）</span>
    </footer>
  </main>

  <script src="js/game.js"></script>
</body>
</html>
