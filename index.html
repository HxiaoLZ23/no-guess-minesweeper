<!DOCTYPE html>
<html lang="zh-CN" data-theme="soft" data-palette="classic">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#152a45" />
  <title>无猜扫雷</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=10" />
</head>
<body>
  <div class="bg-wash" aria-hidden="true"></div>
  <main class="app">
    <header class="hero">
      <p class="brand">无猜扫雷</p>
      <h1 class="tagline">每一步均可依逻辑确定</h1>
      <p class="sub" id="hero-sub">请选择模式</p>
    </header>

    <section class="home" id="home" aria-label="首页">
      <div class="card-grid home-modes">
        <button type="button" class="pick-card" data-go="boards" data-mode="practice">
          <strong>练习模式</strong>
          <span>可使用提示与撤销</span>
        </button>
        <button type="button" class="pick-card" data-go="boards" data-mode="speed">
          <strong>竞速模式</strong>
          <span>倒计时后开始。无提示，不可暂停</span>
        </button>
        <button type="button" class="pick-card" data-go="boards" data-mode="zen">
          <strong>禅模式</strong>
          <span>不计时。踩雷不结束对局</span>
        </button>
        <button type="button" class="pick-card" data-go="campaign">
          <strong>闯关模式</strong>
          <span>自 8×8 起，宽度与高度交替增加</span>
        </button>
        <button type="button" class="pick-card" data-go="teach">
          <strong>教学关卡</strong>
          <span>按章节学习定式，可任选关卡</span>
        </button>
      </div>
    </section>

    <section class="home hidden" id="page-boards" aria-label="选盘面">
      <div class="page-head">
        <button type="button" class="text-btn" id="boards-back">返回</button>
        <p class="home-kicker" id="boards-title">选一盘</p>
      </div>
      <p class="hint" id="boards-note"></p>
      <div class="card-grid" id="board-cards"></div>
      <div class="custom hidden" id="custom">
        <label>宽 <input id="cw" type="number" min="5" max="50" value="9" /></label>
        <label>高 <input id="ch" type="number" min="5" max="40" value="9" /></label>
        <label>雷 <input id="cm" type="number" min="1" max="400" value="10" /></label>
        <button type="button" class="text-btn" id="apply-custom">开始这盘</button>
      </div>
    </section>

    <section class="home hidden" id="page-campaign" aria-label="闯关">
      <div class="page-head">
        <button type="button" class="text-btn" id="campaign-back">返回</button>
        <p class="home-kicker">闯关</p>
      </div>
      <p class="hint">关卡自 8×8 起，依 8×8、8×9、9×9、9×10 的顺序增大。每关均可依逻辑完成。</p>
      <p class="hint" id="campaign-progress"></p>
      <button type="button" class="primary-btn" id="campaign-continue">从第 1 关开始</button>
      <div class="card-grid" id="campaign-cards"></div>
    </section>

    <section class="home hidden" id="page-teach" aria-label="教学关卡">
      <div class="page-head">
        <button type="button" class="text-btn" id="teach-back">返回</button>
        <p class="home-kicker">教学关卡</p>
      </div>
      <p class="hint">点击标题进入关卡，亦可先展开解析。</p>
      <div class="card-grid" id="teach-cards"></div>
    </section>

    <section class="play hidden" id="play">
    <section class="panel" aria-label="游戏控制">
      <div class="controls">
        <button type="button" class="text-btn" id="home-btn">返回</button>
        <p class="play-label" id="play-label">练习</p>
      </div>
      <select id="diff" class="hidden" tabindex="-1" aria-hidden="true"></select>
      <select id="lesson" class="hidden" tabindex="-1" aria-hidden="true"></select>

      <div class="hud">
        <div class="stat">
          <span class="stat-label">剩余</span>
          <span class="stat-value" id="mine-count">10</span>
        </div>
        <button type="button" class="face" id="face-btn" title="新游戏" aria-label="新游戏">◎</button>
        <div class="stat">
          <span class="stat-label">用时</span>
          <button type="button" class="stat-value timer-btn" id="timer" title="暂停">0.00</button>
        </div>
        <div class="stat">
          <span class="stat-label" id="progress-label">进度</span>
          <span class="stat-value" id="progress">0%</span>
        </div>
      </div>

      <p class="hint" id="status" role="status" aria-live="polite">左键翻开，右键标旗。数字周围旗数已满足时，双击或中键该格，可翻开其余邻格。</p>
      <div class="lesson-read hidden" id="lesson-read">
        <button type="button" class="text-btn" id="lesson-read-btn">展开解析</button>
        <p class="lesson-read-body hidden" id="lesson-read-body"></p>
      </div>

      <div class="tools" id="assist-tools">
        <button type="button" class="text-btn" id="hint-btn">提示</button>
        <button type="button" class="text-btn" id="undo-btn">撤销</button>
        <button type="button" class="text-btn" id="redo-btn">重做</button>
        <button type="button" class="text-btn" id="analyze-btn">分析</button>
      </div>
      <div class="tools">
        <button type="button" class="text-btn" id="flag-mode">翻开</button>
      </div>
    </section>

    <section class="board-wrap" id="board-wrap">
      <div class="board" id="board" role="grid" aria-label="雷区"></div>
      <div class="fx-layer" id="fx-layer" aria-hidden="true"></div>
      <div class="overlay hidden" id="overlay">
        <div class="overlay-card">
          <p class="overlay-title" id="overlay-title">胜利</p>
          <p class="overlay-msg" id="overlay-msg"></p>
          <button type="button" class="primary-btn" id="again-btn">再来一局</button>
        </div>
      </div>
      <div class="overlay hidden" id="race-gate">
        <div class="overlay-card">
          <p class="overlay-title" id="race-count">3</p>
          <p class="overlay-msg" id="race-msg">准备</p>
        </div>
      </div>
      <div class="overlay hidden" id="pause-layer">
        <div class="overlay-card">
          <p class="overlay-title">已暂停</p>
          <button type="button" class="primary-btn" id="resume-btn">继续</button>
        </div>
      </div>
    </section>

    <div class="replay-bar hidden" id="replay-bar">
      <span id="replay-status">复盘</span>
      <button type="button" class="text-btn" id="rp-toggle">播放</button>
      <button type="button" class="text-btn" data-rate="0.5">0.5×</button>
      <button type="button" class="text-btn active" data-rate="1">1×</button>
      <button type="button" class="text-btn" data-rate="2">2×</button>
      <button type="button" class="text-btn" data-rate="4">4×</button>
      <button type="button" class="text-btn" id="rp-step">下一步</button>
      <button type="button" class="text-btn" id="rp-exit">退出</button>
    </div>

    </section>

    <footer class="foot">
      <button type="button" class="text-btn" id="open-settings">设置</button>
      <button type="button" class="text-btn" id="open-stats">统计</button>
      <button type="button" class="text-btn" id="open-share">分享</button>
      <button type="button" class="text-btn" id="open-replay">复盘</button>
      <span class="foot-note">方向键 · 空格翻开 · F 标旗</span>
      <a class="text-btn foot-github" href="https://github.com/HxiaoLZ23/no-guess-minesweeper" target="_blank" rel="noopener noreferrer">GitHub</a>
    </footer>
  </main>

  <div class="modal hidden" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="modal-title">设置</h2>
        <button type="button" class="text-btn" id="modal-close">关闭</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="js/util.js?v=12"></script>
  <script src="js/solver.js?v=6"></script>
  <script src="js/generate.js?v=13"></script>
  <script src="js/persist.js?v=9"></script>
  <script src="js/campaign.js?v=3"></script>
  <script src="js/cloud.js?v=3"></script>
  <script src="js/ambiance.js?v=1"></script>
  <script src="js/game.js?v=24"></script>
</body>
</html>
